spring:
  application:
    name: livebeat

  datasource:
    url: jdbc:postgresql://localhost:5432/livebeat
    username: ${POSTGRES_USER:livebeat}
    password: ${POSTGRES_PASSWORD:livebeat_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:livebeat_dev}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 10
          min-idle: 2

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:livebeat}
    password: ${RABBITMQ_PASSWORD:livebeat_dev}
    virtual-host: /

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      # 封面圖上傳大小上限，超過時 Spring 拋 MaxUploadSizeExceededException → 413
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

app:
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:livebeat}

  jwt:
    # 無預設值：未設定 JWT_SECRET 時應用程式拒絕啟動（見 JwtService 啟動驗證）。
    # 各環境以環境變數 / Secret Manager 注入高熵 256-bit 密鑰。
    secret: ${JWT_SECRET}
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
    cookie-secure: ${COOKIE_SECURE:false}

  # CORS 允許來源（逗號分隔）；正式環境前端網域以環境變數注入，先留開發來源佔位。
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # 認證端點 per-IP 限流門檻（可由環境變數覆寫）
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
    register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:5}
    refresh-per-hour: ${RATE_LIMIT_REFRESH_PER_HOUR:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    # 預設安全等級：勿用 DEBUG（尤其 org.springframework.security 的 DEBUG 會記敏感資訊）。
    # 開發時如需詳細日誌，請於本機 application-local.yml / 環境變數覆寫，勿提交。
    com.livebeat: INFO
    org.flywaydb: INFO
